version: 2

project_name: jmp

before:
  hooks:
    - go mod tidy
    # Man pages are shipped in the archives and installed by the formula.
    - go run . man man

builds:
  - id: jmp
    main: .
    binary: jmp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -ldflags=-s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md
      - man/*.1

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: biyan113
    name: jmp
  draft: false
  name_template: "{{ .Tag }}"
  header: |
    ## jmp {{ .Tag }}

    See the [changelog](./CHANGELOG.md) for details.

brews:
  - name: jmp
    homepage: https://github.com/biyan113/jmp
    description: Smart directory jumper — Go rewrite and enhancement of autojump (frecency ranking, TUI, aliases, multi-device sync)
    license: MIT
    directory: Formula
    repository:
      owner: biyan113
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    caveats: |-
      To enable the `j` command and directory auto-tracking, add the matching
      line to your shell config and restart the shell:
        bash:       eval "$(jmp init bash)"
        zsh:        eval "$(jmp init zsh)"
        fish:       jmp init fish | source
        PowerShell: Invoke-Expression (& jmp init powershell | Out-String)
    install: |-
      bin.install "jmp"
      man1.install Dir["man/*.1"]
    test: |
      assert_match "jmp", shell_output("#{bin}/jmp version")
